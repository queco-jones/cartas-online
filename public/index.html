<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartas contra tus amigos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="themeBtn" class="theme-btn" aria-label="Cambiar tema">Modo oscuro</button>

  <main class="container">
    <section id="home" class="panel home-panel">
      <h1>Cartas contra tus amigos</h1>
      <p class="subtitle">Crea una sala privada y juega desde el navegador.</p>
      <div id="homeProfile" class="profile-editor"></div>
      <button id="createBtn" class="primary">Crear partida</button>
      <div class="divider"><span>o</span></div>
      <label for="roomCode">Código de sala</label>
      <div class="join-row">
        <input id="roomCode" maxlength="4" placeholder="ABCD" autocomplete="off" />
        <button id="joinBtn">Entrar</button>
      </div>
      <p id="homeError" class="error"></p>
    </section>

    <section id="game" class="hidden">
      <header class="topbar">
        <div><span class="muted">Sala</span><strong id="codeText"></strong></div>
        <div class="top-actions">
          <button id="profileBtn" class="small">Mi perfil</button>
          <button id="copyBtn" class="small">Copiar código</button>
          <button id="leaveBtn" class="small danger">Salir</button>
        </div>
      </header>

      <div class="layout">
        <aside class="panel players-panel">
          <h2>Jugadores</h2>
          <div id="players"></div>
          <button id="startBtn" class="primary hidden">Empezar partida</button>
          <button id="nextBtn" class="primary hidden">Siguiente ronda</button>
          <p id="gameError" class="error"></p>
        </aside>

        <section class="game-area">
          <div id="lobby" class="panel center-panel">
            <h2>Esperando jugadores</h2>
            <p>Comparte el código de sala. Se necesitan al menos 3 jugadores.</p>
            <p id="deckStats" class="deck-stats"></p>
          </div>
          <div id="round" class="hidden">
            <div class="black-card" id="blackCard"></div>
            <p id="statusText" class="status"></p>
            <div id="submissions" class="cards-grid"></div>
            <div id="hand" class="cards-grid"></div>
            <div id="confirmArea" class="confirm-area hidden">
              <button id="confirmBtn" class="primary confirm-btn" disabled>Confirmar carta</button>
              <button id="cancelBtn" class="secondary">Cancelar selección</button>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div id="profileModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <section class="modal panel">
      <button id="closeProfileBtn" class="modal-close" aria-label="Cerrar">×</button>
      <h2 id="profileTitle">Mi perfil</h2>
      <div class="profile-editor">
        <button id="avatarPicker" class="avatar-picker" type="button" aria-label="Elegir foto de perfil">
          <img id="avatarPreview" alt="Foto de perfil" class="hidden" />
          <span id="avatarInitial">?</span><span class="avatar-edit">✎</span>
        </button>
        <div class="profile-fields">
          <label for="name">Tu nombre</label>
          <input id="name" maxlength="24" placeholder="Escribe tu nombre" autocomplete="nickname" />
          <small>Se guarda automáticamente en este navegador.</small>
        </div>
        <input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp" class="hidden" />
      </div>
      <p id="profileError" class="error"></p>
      <button id="saveProfileBtn" class="primary">Guardar</button>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
